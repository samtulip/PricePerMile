name: Delete Merged Branches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete branches merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/branches --paginate \
            --jq '.[].name' | while read branch; do
            if [ "$branch" = "main" ]; then
              continue
            fi
            merged=$(gh api "repos/${{ github.repository }}/compare/main...${branch}" \
              --jq '.status' 2>/dev/null || echo "error")
            if [ "$merged" = "behind" ] || [ "$merged" = "identical" ]; then
              echo "Deleting merged branch: $branch"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${branch}"
            fi
          done
